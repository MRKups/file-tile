name: Feature Request
description: Propose a focused workflow or usability improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or Workflow Need
      description: What task feels slow, awkward, or impossible right now?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Behavior
      description: Concise description of how it should work.
    validations:
      required: true
