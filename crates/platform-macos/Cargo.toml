[package]
name = "file-tile-platform-macos"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"
authors = ["Michał Kupś"]
repository = "https://github.com/MRKups/file-tile"
description = "Safe macOS platform services for file-tile"

[target.'cfg(target_os = "macos")'.dependencies]
file-tile-platform-macos-appkit = { path = "../platform-macos-appkit", version = "=0.1.0" }
objc2 = { version = "=0.6.5", default-features = false, features = ["std"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
    "std",
    "NSApplication",
    "NSColor",
    "NSColorSpace",
    "NSFont",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSResponder",
    "NSScreen",
    "NSView",
    "NSWindow",
    "objc2-core-foundation",
] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSDate",
    "NSDateFormatter",
    "NSEnumerator",
    "NSError",
    "NSFileManager",
    "NSString",
    "NSURL",
] }
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
too_many_lines = "warn"
unnecessary_wraps = "warn"
unused_async = "warn"
