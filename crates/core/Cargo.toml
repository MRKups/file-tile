[package]
name = "file-tile-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Core domain, application state, persistence, diagnostics, and filesystem workers for file-tile"

[dependencies]
file-tile-capabilities.workspace = true
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
uuid = { version = "=1.28.0", default-features = false, features = ["std", "v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
file-tile-platform-macos.workspace = true
notify = { version = "=9.0.0-rc.5", default-features = false, features = ["macos_fsevent"] }
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
file-tile-platform-linux.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
file-tile-platform-windows.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
too_many_lines = "warn"
unnecessary_wraps = "warn"
unused_async = "warn"
